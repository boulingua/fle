baseURL = "https://boulingua.github.io/fle/"
title = "FLE — S. Le Boulanger"
languageCode = "fr"
defaultContentLanguage = "fr"
enableEmoji = false
enableRobotsTXT = true

[pagination]
  pagerSize = 20

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

[params]
  code = "fle"
  license = "CC BY-SA 4.0"
  # Two self-hosted faces, declared rather than preloaded from a forked copy of
  # the kit's head partial.
  font_preload = [
    "fonts/source-sans-3-v19-latin_latin-ext-regular.woff2",
    "fonts/jetbrains-mono-v24-latin_latin-ext-regular.woff2",
  ]
  # Hide the theme's floating colour-scheme toggle; the navbar hosts the single #dark-mode-toggle.
  hideColorSchemeToggle = true
  author = "S. Le Boulanger"
  description = "Curriculum FLE bilingue pour l'enseignement secondaire, classes 6 à 13, aligné sur un référentiel régional."
  keywords = "FLE,français langue étrangère,enseignement secondaire,Bildungsplan,OER,CECRL,curriculum"
  info = ["FLE · Classes 6 à 13", "Curriculum bilingue OER", "S. Le Boulanger"]
  dateFormat = "2006-01-02"
  hideFooter = false
  hideCredits = true
  since = 2025
  colorScheme = "auto"
  # The kit supplies tokens.css and custom.css through the module; course.css
  # holds only what is fle's own, and layers on top.
  customCSS = ["css/tokens.css", "css/custom.css", "css/course.css", "css/network.css"]
  repoURL = "https://github.com/boulingua/fle"
  # Short brand label for the top-of-page navbar. Browser title and OG meta
  # continue to use the full `title = "FLE — S. Le Boulanger"`.
  navbarTitle = "FLE"

[[params.social]]
  name = "GitHub"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/boulingua/fle"

# ── Top navbar ─────────────────────────────────────────────
# Five left-aligned items, plus Mentions légales right-aligned (params.align
# = "end") and the GitHub icon further right (rendered as a fixed item by
# layouts/_partials/header.html). The Coder theme renders only top-level
# menu entries — sub-items remain in the config for footer / sitemap use
# but are not visible in the bar. Pages dropped from the bar (Référentiel,
# Programme, Références) are reachable via the footer and cross-page links.

[[menu.main]]
  name = "Accueil"
  weight = 1
  url = "/"

[[menu.main]]
  name = "À propos"
  weight = 2
  url = "/a_propos/"

[[menu.main]]
  identifier = "materiel"
  name = "Matériel"
  weight = 3
  url = "/materiel/"

# Filière G+M dropdown
[[menu.main]]
  identifier = "track-gm"
  name = "Filière G+M"
  weight = 4
  url = "/filiere-gm/"

# Filière E dropdown
[[menu.main]]
  identifier = "track-e"
  name = "Filière E"
  weight = 5
  url = "/filiere-e/"

# Right-side legal dropdown — params.align = "end" pushes it to the
# right of the navbar (margin-left:auto on the first end-aligned item).
[[menu.main]]
  identifier = "legal"
  name = "Impressum"
  weight = 99
  url = "/impressum/"
  [menu.main.params]
    align = "end"

[module]
  # First match wins in listed order, so the kit must precede hugo-coder to
  # override it. Listed after, the theme's own body/extensions.html and
  # head/extensions.html stubs win and the kit is never reached — which takes
  # every VG Wort pixel off the site with a green build.
  [[module.imports]]
    path = "github.com/boulingua/kit"
  [[module.imports]]
    path = "github.com/luizdepra/hugo-coder"

